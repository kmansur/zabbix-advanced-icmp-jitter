name: Apply approved non-hybrid hardening

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - .github/workflows/_apply-approved-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/professionalization
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Restore main architecture and approved hardening
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          cp scripts/advanced_icmp_ping.py /tmp/advanced_icmp_ping.py
          cp tests/test_advanced_icmp_ping.py /tmp/test_advanced_icmp_ping.py

          git checkout origin/main -- \
            README.md README.pt-BR.md VERSION \
            docs/en docs/pt-BR \
            scripts/advanced_icmp_ping.py \
            tests/test_advanced_icmp_ping.py \
            templates/zabbix-7.0/advanced-icmp-ping-with-jitter.yaml \
            templates/zabbix-8.0/advanced-icmp-ping-with-jitter.yaml \
            tools/validate_templates.py

          cp /tmp/advanced_icmp_ping.py scripts/advanced_icmp_ping.py
          cp /tmp/test_advanced_icmp_ping.py tests/test_advanced_icmp_ping.py

          rm -f docs/en/legacy-advancedping-upgrade.md docs/pt-BR/legacy-advancedping-upgrade.md

          python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          # Keep the hardened collector, but preserve the main branch probe profile.
          script = Path("scripts/advanced_icmp_ping.py")
          text = script.read_text(encoding="utf-8")
          replacements = {
              "DEFAULT_INTERVAL_MS = 250": "DEFAULT_INTERVAL_MS = 100",
              "DEFAULT_TIMEOUT_MS = 250": "DEFAULT_TIMEOUT_MS = 1000",
              "MIN_INTERVAL_MS = 10": "MIN_INTERVAL_MS = 20",
              "MAX_INTERVAL_MS = 5000": "MAX_INTERVAL_MS = 60000",
              "MIN_TIMEOUT_MS = 10": "MIN_TIMEOUT_MS = 50",
              "MAX_TIMEOUT_MS = 5000": "MAX_TIMEOUT_MS = 60000",
              "./advanced_icmp_ping.py 8.8.8.8 20 250 250": "./advanced_icmp_ping.py 8.8.8.8 20 100 1000",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = re.sub(
              r'\n    if timeout_ms > interval_ms:\n        return \(\n            "fping timeout must not exceed probe interval in count mode "\n            f"\(timeout=\{timeout_ms\}ms, interval=\{interval_ms\}ms\)"\n        \)\n',
              "\n",
              text,
              count=1,
          )
          script.write_text(text, encoding="utf-8")

          # Keep the expanded tests, removing only the discarded timing rule and
          # aligning safe-default expectations with the main branch profile.
          tests = Path("tests/test_advanced_icmp_ping.py")
          text = tests.read_text(encoding="utf-8")
          text = re.sub(
              r'\ndef test_probe_config_rejects_timeout_larger_than_period\(\):.*?(?=\ndef )',
              "\n",
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\ndef test_main_rejects_unsafe_timing_before_fping\(.*?(?=\ndef )',
              "\n",
              text,
              flags=re.S,
          )
          old = '''        "-p",\n        "250",\n        "-t",\n        "250",\n        "127.0.0.1",'''
          new = '''        "-p",\n        "100",\n        "-t",\n        "1000",\n        "127.0.0.1",'''
          text = text.replace(old, new)
          tests.write_text(text, encoding="utf-8")

          class NoAliasDumper(yaml.SafeDumper):
              def ignore_aliases(self, data):
                  return True

          template_name = "Advanced ICMP Ping with Jitter"
          collector_expression = f'last(/{template_name}/advanced.ping.error)<>""'
          old_loss = f'last(/{template_name}/advanced.ping.loss,#2)>{{$ADV_ICMP_LOSS_WARN}}'
          new_loss = (
              f'min(/{template_name}/advanced.ping.loss,#2)>{{$ADV_ICMP_LOSS_WARN}} '
              f'and min(/{template_name}/advanced.ping.rcv,#2)>0'
          )
          collector_targets = {
              "Advanced ICMP: High response time",
              "Advanced ICMP: High jitter",
              "Advanced ICMP: High packet loss",
              "Advanced ICMP: High RTT standard deviation",
              "Advanced ICMP: High time differences (Min/Max)",
              "Advanced ICMP: Long unavailable by ICMP ping",
              "Advanced ICMP: Unavailable by ICMP ping",
          }

          def walk(node):
              if isinstance(node, dict):
                  if "expression" in node and isinstance(node["expression"], str):
                      node["expression"] = node["expression"].replace(old_loss, new_loss)
                  if node.get("name") in collector_targets and "expression" in node:
                      deps = node.setdefault("dependencies", [])
                      if not any(dep.get("name") == "Advanced ICMP: Collector error" for dep in deps):
                          deps.append(
                              {
                                  "name": "Advanced ICMP: Collector error",
                                  "expression": collector_expression,
                              }
                          )
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)

          for version in ("7.0", "8.0"):
              path = Path(f"templates/zabbix-{version}/advanced-icmp-ping-with-jitter.yaml")
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              template = data["zabbix_export"]["templates"][0]
              items = {item["key"]: item for item in template["items"]}
              items["advanced.ping.loss"]["value_type"] = "FLOAT"
              raw_key = next(key for key in items if key.startswith("advanced_icmp_ping.py["))
              items[raw_key]["history"] = "1h"
              walk(data)
              path.write_text(
                  yaml.dump(
                      data,
                      Dumper=NoAliasDumper,
                      sort_keys=False,
                      allow_unicode=True,
                      width=1000,
                  ),
                  encoding="utf-8",
              )

          # Keep documentation consistent with the approved collector baseline.
          for filename in (
              "README.md",
              "README.pt-BR.md",
              "docs/en/installation.md",
              "docs/pt-BR/installation.md",
              "docs/en/configuration.md",
              "docs/pt-BR/configuration.md",
              "docs/en/tuning.md",
              "docs/pt-BR/tuning.md",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace("Python 3.6+", "Python 3.9+")
              text = text.replace("Python 3.6 or newer", "Python 3.9 or newer")
              text = text.replace("Python 3.6 ou mais recente", "Python 3.9 ou mais recente")
              path.write_text(text, encoding="utf-8")

          en_install = Path("docs/en/installation.md")
          text = en_install.read_text(encoding="utf-8")
          if "## Where the collector runs" not in text:
              text += '''\n\n## Where the collector runs\n\n`advanced_icmp_ping.py` is a Zabbix **external check**. It runs on the Zabbix server or on the Zabbix proxy responsible for the host, not on the monitored device. The same server/proxy must therefore have Python and `fping` installed and executable by the Zabbix service account.\n'''
          en_install.write_text(text, encoding="utf-8")

          pt_install = Path("docs/pt-BR/installation.md")
          text = pt_install.read_text(encoding="utf-8")
          if "## Onde o coletor é executado" not in text:
              text += '''\n\n## Onde o coletor é executado\n\nO `advanced_icmp_ping.py` é um **external check** do Zabbix. Ele é executado no Zabbix server ou no Zabbix proxy responsável pelo host, e não no dispositivo monitorado. Portanto, esse mesmo server/proxy deve ter Python e `fping` instalados e executáveis pela conta de serviço do Zabbix.\n'''
          pt_install.write_text(text, encoding="utf-8")

          for filename, old_expr, explanation in (
              (
                  "docs/en/triggers.md",
                  f'last(/{template_name}/advanced.ping.loss,#2)>{{$ADV_ICMP_LOSS_WARN}}',
                  "The trigger requires two consecutive degraded samples above the threshold and at least one reply in both samples. Complete loss (`rcv=0`) is handled by the availability triggers. Network symptom triggers also depend on `Advanced ICMP: Collector error`, so a collector failure is not reported as a network outage."
              ),
              (
                  "docs/pt-BR/triggers.md",
                  f'last(/{template_name}/advanced.ping.loss,#2)>{{$ADV_ICMP_LOSS_WARN}}',
                  "A trigger exige duas amostras consecutivas degradadas acima do limite e pelo menos uma resposta em ambas. Perda total (`rcv=0`) é tratada pelas triggers de indisponibilidade. As triggers de sintomas de rede também dependem de `Advanced ICMP: Collector error`, evitando que uma falha do coletor seja reportada como indisponibilidade da rede."
              ),
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace(old_expr, new_loss)
              if explanation not in text:
                  marker = "The threshold is controlled by `{$ADV_ICMP_LOSS_WARN}`." if "/en/" in filename else "O limite é controlado por `{$ADV_ICMP_LOSS_WARN}`."
                  if marker in text:
                      text = text.replace(marker, marker + "\n\n" + explanation, 1)
                  else:
                      text += "\n\n" + explanation + "\n"
              path.write_text(text, encoding="utf-8")

          Path("docs/en/legacy-advancedping-upgrade.md").write_text('''# Upgrading from legacy AdvancedPING\n\n[English](legacy-advancedping-upgrade.md) | [Português (Brasil)](../pt-BR/legacy-advancedping-upgrade.md)\n\nOlder AdvancedPING objects can remain on a host after a plain **Unlink**, because Zabbix preserves inherited entities as local host objects. If the intention is to remove the inherited legacy objects too, use **Unlink and clear** only after reviewing the impact and following the normal backup/change-control process.\n\nBefore linking this template broadly, test on a clean temporary host and check for duplicate legacy triggers such as `Unavailable by ICMP ping` or `High ICMP ping loss`. The maintained template uses the `Advanced ICMP:` trigger prefix.\n\nDo not delete objects only because they use an `advanced.ping.*` key; the maintained template uses the same key namespace. Confirm the object's source first.\n''', encoding="utf-8")
          Path("docs/pt-BR/legacy-advancedping-upgrade.md").write_text('''# Migração do AdvancedPING legado\n\n[English](../en/legacy-advancedping-upgrade.md) | [Português (Brasil)](legacy-advancedping-upgrade.md)\n\nObjetos antigos do AdvancedPING podem permanecer no host depois de um **Unlink** simples, pois o Zabbix preserva entidades herdadas como objetos locais do host. Se a intenção for remover também os objetos herdados do template antigo, use **Unlink and clear** somente depois de revisar o impacto e seguir o processo normal de backup e controle de mudanças.\n\nAntes de aplicar este template amplamente, teste em um host temporário limpo e procure triggers legadas duplicadas, como `Unavailable by ICMP ping` ou `High ICMP ping loss`. O template mantido utiliza o prefixo `Advanced ICMP:` nas triggers.\n\nNão remova objetos apenas por utilizarem uma chave `advanced.ping.*`; o template mantido usa o mesmo namespace. Confirme primeiro a origem do objeto.\n''', encoding="utf-8")

          for filename, link in (
              ("docs/en/README.md", "- [Upgrading from legacy AdvancedPING](legacy-advancedping-upgrade.md)"),
              ("docs/pt-BR/README.md", "- [Migração do AdvancedPING legado](legacy-advancedping-upgrade.md)"),
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if link not in text:
                  text = text.rstrip() + "\n" + link + "\n"
              path.write_text(text, encoding="utf-8")
          PY

          cat > tools/validate_templates.py <<'PY'
          #!/usr/bin/env python3
          """Validate versioned Advanced ICMP Ping with Jitter templates."""

          import sys
          from pathlib import Path
          import yaml

          ROOT = Path(__file__).resolve().parents[1]
          TEMPLATE_FILE = "advanced-icmp-ping-with-jitter.yaml"
          TEMPLATE_NAME = "Advanced ICMP Ping with Jitter"
          VERSION = (ROOT / "VERSION").read_text(encoding="utf-8").strip()
          FLOAT_KEYS = {
              "advanced.ping.avg",
              "advanced.ping.loss",
              "advanced.ping.max",
              "advanced.ping.min",
              "advanced.ping.jitter",
              "advanced.ping.stddev",
          }
          EXPECTED_DEPENDENT_KEYS = FLOAT_KEYS | {
              "advanced.ping.rcv",
              "advanced.ping.xmt",
              "advanced.ping.error",
          }
          COLLECTOR_ERROR = "Advanced ICMP: Collector error"
          COLLECTOR_DEPENDENCY_TARGETS = {
              "Advanced ICMP: High response time",
              "Advanced ICMP: High jitter",
              "Advanced ICMP: High packet loss",
              "Advanced ICMP: High RTT standard deviation",
              "Advanced ICMP: High time differences (Min/Max)",
              "Advanced ICMP: Long unavailable by ICMP ping",
              "Advanced ICMP: Unavailable by ICMP ping",
          }

          def fail(message):
              print(f"ERROR: {message}", file=sys.stderr)
              raise SystemExit(1)

          def collect_triggers(node):
              result = []
              if isinstance(node, dict):
                  if "name" in node and "expression" in node and "priority" in node:
                      result.append(node)
                  for value in node.values():
                      result.extend(collect_triggers(value))
              elif isinstance(node, list):
                  for value in node:
                      result.extend(collect_triggers(value))
              return result

          def item_signature(item):
              preprocessing = tuple(
                  (step.get("type", ""), tuple(str(v) for v in step.get("parameters", [])))
                  for step in item.get("preprocessing", [])
              )
              tags = tuple(sorted((tag.get("tag", ""), str(tag.get("value", ""))) for tag in item.get("tags", [])))
              return (
                  item.get("name", ""), item.get("key", ""), item.get("type", ""),
                  str(item.get("history", "")), item.get("value_type", ""), item.get("units", ""),
                  preprocessing, tags,
              )

          def trigger_signature(trigger):
              dependencies = tuple(sorted(
                  (dep.get("name", ""), str(dep.get("expression", "")))
                  for dep in trigger.get("dependencies", [])
              ))
              tags = tuple(sorted((tag.get("tag", ""), str(tag.get("value", ""))) for tag in trigger.get("tags", [])))
              return (
                  trigger.get("name", ""), str(trigger.get("expression", "")),
                  trigger.get("priority", ""), trigger.get("status", "ENABLED"), dependencies, tags,
              )

          def validate_version(version):
              path = ROOT / "templates" / f"zabbix-{version}" / TEMPLATE_FILE
              if not path.is_file():
                  fail(f"missing {path.relative_to(ROOT)}")
              raw = path.read_text(encoding="utf-8")
              if "icmpping" in raw or "icmppingloss" in raw or "icmppingsec" in raw:
                  fail(f"Zabbix {version}: native ICMP keys are not allowed in this project")
              data = yaml.safe_load(raw)
              if str(data.get("zabbix_export", {}).get("version", "")) != version:
                  fail(f"Zabbix {version}: export version mismatch")
              templates = data.get("zabbix_export", {}).get("templates", [])
              if len(templates) != 1:
                  fail(f"Zabbix {version}: expected exactly one template")
              template = templates[0]
              if template.get("template") != TEMPLATE_NAME:
                  fail(f"Zabbix {version}: unexpected template name")
              if str(template.get("vendor", {}).get("version", "")) != VERSION:
                  fail(f"Zabbix {version}: vendor.version must match VERSION ({VERSION})")

              items = {item["key"]: item for item in template.get("items", [])}
              if not EXPECTED_DEPENDENT_KEYS.issubset(items):
                  fail(f"Zabbix {version}: missing expected advanced.ping dependent items")
              for key in FLOAT_KEYS:
                  if items[key].get("value_type") != "FLOAT":
                      fail(f"Zabbix {version}: {key} must explicitly use value_type FLOAT")
              if items["advanced.ping.error"].get("value_type") != "TEXT":
                  fail(f"Zabbix {version}: advanced.ping.error must be TEXT")

              masters = [item for item in template.get("items", []) if str(item.get("key", "")).startswith("advanced_icmp_ping.py[")]
              if len(masters) != 1:
                  fail(f"Zabbix {version}: expected exactly one external master item")
              master = masters[0]
              if master.get("type") != "EXTERNAL" or master.get("value_type") != "TEXT":
                  fail(f"Zabbix {version}: external master must be EXTERNAL/TEXT")
              if str(master.get("history", "")) != "1h":
                  fail(f"Zabbix {version}: raw JSON history must be 1h")

              triggers = collect_triggers(data)
              by_name = {trigger["name"]: trigger for trigger in triggers}
              packet = by_name.get("Advanced ICMP: High packet loss")
              if packet is None:
                  fail(f"Zabbix {version}: packet loss trigger missing")
              expression = str(packet.get("expression", ""))
              if "min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)" not in expression:
                  fail(f"Zabbix {version}: packet loss must require two consecutive samples")
              if "min(/Advanced ICMP Ping with Jitter/advanced.ping.rcv,#2)>0" not in expression:
                  fail(f"Zabbix {version}: packet loss must suppress complete outages")
              if "last(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)" in raw:
                  fail(f"Zabbix {version}: obsolete last(loss,#2) expression detected")

              for name in COLLECTOR_DEPENDENCY_TARGETS:
                  trigger = by_name.get(name)
                  if trigger is None:
                      fail(f"Zabbix {version}: missing trigger {name!r}")
                  dependency_names = {dep.get("name") for dep in trigger.get("dependencies", [])}
                  if COLLECTOR_ERROR not in dependency_names:
                      fail(f"Zabbix {version}: {name!r} must depend on Collector error")

              return (
                  tuple(sorted(item_signature(item) for item in template.get("items", []))),
                  tuple(sorted(trigger_signature(trigger) for trigger in triggers)),
                  tuple(sorted((macro.get("macro", ""), str(macro.get("value", ""))) for macro in template.get("macros", []))),
              )

          def main():
              separate = list((ROOT / "templates").glob("zabbix-*/advanced-icmp-ping.yaml"))
              if separate:
                  fail("separate/native Advanced ICMP Ping template must not exist")
              signatures = {version: validate_version(version) for version in ("7.0", "8.0")}
              if signatures["7.0"] != signatures["8.0"]:
                  fail("Zabbix 7.0 and 8.0 templates are not semantically equivalent")
              print(f"OK: non-hybrid Advanced ICMP templates validated; project version {VERSION}")

          if __name__ == "__main__":
              main()
          PY

      - name: Format and validate
        run: |
          ruff format scripts tools tests
          python tools/validate_templates.py
          python tools/validate_docs.py
          python -m compileall -q scripts tools tests
          ruff check scripts tools tests
          ruff format --check scripts tools tests
          pytest -q
      - name: Commit approved implementation
        run: |
          git config user.name "Karim Mansur"
          git config user.email "karim.mansur@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: keep approved non-hybrid hardening only"
          git push origin HEAD:hardening/professionalization
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/_apply-approved-hardening.yml
          git commit -m "chore: remove temporary approved-hardening workflow"
          git push origin HEAD:hardening/professionalization
