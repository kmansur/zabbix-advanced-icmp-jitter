name: Apply approved non-hybrid hardening

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - .github/workflows/_apply-approved-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/professionalization
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install current validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply approved changes only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/professionalization-hybrid-discarded

          # Reuse only repository/tooling and collector hardening that was approved.
          for path in \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/security.yml \
            requirements-dev.txt \
            tools/validate_docs.py \
            scripts/advanced_icmp_ping.py \
            tests/test_advanced_icmp_ping.py; do
            git show origin/archive/professionalization-hybrid-discarded:"$path" > "$path"
          done

          python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          # Collector: keep hardening, but preserve the main branch 20/100/1000 profile.
          script = Path("scripts/advanced_icmp_ping.py")
          text = script.read_text(encoding="utf-8")
          replacements = {
              "DEFAULT_COUNT = 20": "DEFAULT_COUNT = 20",
              "DEFAULT_INTERVAL_MS = 250": "DEFAULT_INTERVAL_MS = 100",
              "DEFAULT_TIMEOUT_MS = 250": "DEFAULT_TIMEOUT_MS = 1000",
              "MIN_INTERVAL_MS = 10": "MIN_INTERVAL_MS = 20",
              "MAX_INTERVAL_MS = 5000": "MAX_INTERVAL_MS = 60000",
              "MIN_TIMEOUT_MS = 10": "MIN_TIMEOUT_MS = 50",
              "MAX_TIMEOUT_MS = 5000": "MAX_TIMEOUT_MS = 60000",
              "./advanced_icmp_ping.py 8.8.8.8 20 250 250": "./advanced_icmp_ping.py 8.8.8.8 20 100 1000",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = re.sub(
              r'\n    if timeout_ms > interval_ms:\n        return \(\n            "fping timeout must not exceed probe interval in count mode "\n            f"\(timeout=\{timeout_ms\}ms, interval=\{interval_ms\}ms\)"\n        \)\n',
              "\n",
              text,
              count=1,
          )
          script.write_text(text, encoding="utf-8")

          # Tests: preserve all approved coverage, remove only the discarded timeout<=interval rule.
          tests = Path("tests/test_advanced_icmp_ping.py")
          text = tests.read_text(encoding="utf-8")
          text = re.sub(
              r'\ndef test_probe_config_rejects_timeout_larger_than_period\(\):.*?(?=\ndef )',
              "\n",
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\ndef test_main_rejects_unsafe_timing_before_fping\(.*?(?=\ndef )',
              "\n",
              text,
              flags=re.S,
          )
          text = text.replace('        "250",\n        "-t",\n        "250",\n        "127.0.0.1",', '        "100",\n        "-t",\n        "1000",\n        "127.0.0.1",')
          tests.write_text(text, encoding="utf-8")

          template_name = "Advanced ICMP Ping with Jitter"
          old_loss = f'last(/{template_name}/advanced.ping.loss,#2)>{{$ADV_ICMP_LOSS_WARN}}'
          new_loss = (
              f'min(/{template_name}/advanced.ping.loss,#2)>{{$ADV_ICMP_LOSS_WARN}} '
              f'and min(/{template_name}/advanced.ping.rcv,#2)>0'
          )
          collector_expression = f'last(/{template_name}/advanced.ping.error)<>""'
          collector_targets = {
              "Advanced ICMP: High response time",
              "Advanced ICMP: High jitter",
              "Advanced ICMP: High packet loss",
              "Advanced ICMP: High RTT standard deviation",
              "Advanced ICMP: High time differences (Min/Max)",
              "Advanced ICMP: Long unavailable by ICMP ping",
              "Advanced ICMP: Unavailable by ICMP ping",
          }

          def mutate(node):
              if isinstance(node, dict):
                  expression = node.get("expression")
                  if isinstance(expression, str):
                      node["expression"] = expression.replace(old_loss, new_loss)
                  if node.get("name") in collector_targets and "expression" in node:
                      dependencies = node.setdefault("dependencies", [])
                      if not any(dep.get("name") == "Advanced ICMP: Collector error" for dep in dependencies):
                          dependencies.append(
                              {
                                  "name": "Advanced ICMP: Collector error",
                                  "expression": collector_expression,
                              }
                          )
                  for value in node.values():
                      mutate(value)
              elif isinstance(node, list):
                  for value in node:
                      mutate(value)

          class NoAliasDumper(yaml.SafeDumper):
              def ignore_aliases(self, data):
                  return True

          # Templates begin from main: no native ICMP/simple-check experiment is reused.
          for version in ("7.0", "8.0"):
              path = Path(f"templates/zabbix-{version}/advanced-icmp-ping-with-jitter.yaml")
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              template = data["zabbix_export"]["templates"][0]
              items = {item["key"]: item for item in template["items"]}
              items["advanced.ping.loss"]["value_type"] = "FLOAT"
              masters = [item for item in template["items"] if str(item.get("key", "")).startswith("advanced_icmp_ping.py[")]
              if len(masters) != 1:
                  raise SystemExit(f"Zabbix {version}: expected one external master item")
              masters[0]["history"] = "1h"
              mutate(data)
              path.write_text(
                  yaml.dump(data, Dumper=NoAliasDumper, sort_keys=False, allow_unicode=True, width=1000),
                  encoding="utf-8",
              )

          # Documentation: keep main architecture and defaults; only approved operational clarifications.
          for filename in ("README.md", "README.pt-BR.md", "docs/en/installation.md", "docs/pt-BR/installation.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace("Python 3.6+", "Python 3.9+")
              text = text.replace("Python 3.6 or newer", "Python 3.9 or newer")
              text = text.replace("Python 3.6 ou mais recente", "Python 3.9 ou mais recente")
              path.write_text(text, encoding="utf-8")

          en_install = Path("docs/en/installation.md")
          text = en_install.read_text(encoding="utf-8")
          if "## Where the collector runs" not in text:
              text += "\n\n## Where the collector runs\n\n`advanced_icmp_ping.py` is a Zabbix **external check**. It runs on the Zabbix server or on the Zabbix proxy responsible for the host, not on the monitored device. That server/proxy must have Python and `fping` installed and executable by the Zabbix service account.\n"
          en_install.write_text(text, encoding="utf-8")

          pt_install = Path("docs/pt-BR/installation.md")
          text = pt_install.read_text(encoding="utf-8")
          if "## Onde o coletor é executado" not in text:
              text += "\n\n## Onde o coletor é executado\n\nO `advanced_icmp_ping.py` é um **external check** do Zabbix. Ele é executado no Zabbix server ou no Zabbix proxy responsável pelo host, e não no dispositivo monitorado. Esse server/proxy deve ter Python e `fping` instalados e executáveis pela conta de serviço do Zabbix.\n"
          pt_install.write_text(text, encoding="utf-8")

          for filename, lang in (("docs/en/triggers.md", "en"), ("docs/pt-BR/triggers.md", "pt")):
              path = Path(filename)
              text = path.read_text(encoding="utf-8").replace(old_loss, new_loss)
              note = (
                  "Two consecutive degraded samples are required, and both must still have at least one ICMP reply. Complete loss is handled by the availability triggers. Collector failures are suppressed through the `Advanced ICMP: Collector error` dependency."
                  if lang == "en"
                  else "São exigidas duas amostras consecutivas degradadas, e ambas ainda precisam ter pelo menos uma resposta ICMP. A perda total é tratada pelas triggers de indisponibilidade. Falhas do coletor são suprimidas pela dependência `Advanced ICMP: Collector error`."
              )
              if note not in text:
                  text = text.rstrip() + "\n\n" + note + "\n"
              path.write_text(text, encoding="utf-8")

          Path("docs/en/legacy-advancedping-upgrade.md").write_text(
              "# Upgrading from legacy AdvancedPING\n\n[English](legacy-advancedping-upgrade.md) | [Português (Brasil)](../pt-BR/legacy-advancedping-upgrade.md)\n\nA plain **Unlink** can leave inherited AdvancedPING entities on a host as local objects. If the intention is to remove those inherited legacy objects too, use **Unlink and clear** only after reviewing the impact and following the normal backup/change-control process.\n\nBefore broad rollout, validate on a clean temporary host and look for duplicate legacy triggers such as `Unavailable by ICMP ping` or `High ICMP ping loss`. The maintained template uses the `Advanced ICMP:` trigger prefix.\n\nDo not delete an object only because it uses an `advanced.ping.*` key; the maintained template uses the same namespace. Confirm the object's source first.\n",
              encoding="utf-8",
          )
          Path("docs/pt-BR/legacy-advancedping-upgrade.md").write_text(
              "# Migração do AdvancedPING legado\n\n[English](../en/legacy-advancedping-upgrade.md) | [Português (Brasil)](legacy-advancedping-upgrade.md)\n\nUm **Unlink** simples pode deixar entidades herdadas do AdvancedPING no host como objetos locais. Se a intenção for remover também esses objetos herdados do template legado, use **Unlink and clear** somente depois de revisar o impacto e seguir o processo normal de backup e controle de mudanças.\n\nAntes da aplicação ampla, valide em um host temporário limpo e procure triggers legadas duplicadas, como `Unavailable by ICMP ping` ou `High ICMP ping loss`. O template mantido usa o prefixo `Advanced ICMP:` nas triggers.\n\nNão remova um objeto apenas porque ele utiliza uma chave `advanced.ping.*`; o template mantido usa o mesmo namespace. Confirme primeiro a origem do objeto.\n",
              encoding="utf-8",
          )
          for filename, link in (
              ("docs/en/README.md", "- [Upgrading from legacy AdvancedPING](legacy-advancedping-upgrade.md)"),
              ("docs/pt-BR/README.md", "- [Migração do AdvancedPING legado](legacy-advancedping-upgrade.md)"),
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if link not in text:
                  text = text.rstrip() + "\n" + link + "\n"
              path.write_text(text, encoding="utf-8")
          PY

          cat > tools/validate_templates.py <<'PY'
          #!/usr/bin/env python3
          """Validate Advanced ICMP Ping with Jitter exports and project invariants."""

          import sys
          from pathlib import Path
          import yaml

          ROOT = Path(__file__).resolve().parents[1]
          TEMPLATE_FILE = "advanced-icmp-ping-with-jitter.yaml"
          TEMPLATE_NAME = "Advanced ICMP Ping with Jitter"
          PROJECT_VERSION = (ROOT / "VERSION").read_text(encoding="utf-8").strip()
          FLOAT_KEYS = {
              "advanced.ping.avg", "advanced.ping.loss", "advanced.ping.max",
              "advanced.ping.min", "advanced.ping.jitter", "advanced.ping.stddev",
          }
          EXPECTED_KEYS = FLOAT_KEYS | {"advanced.ping.rcv", "advanced.ping.xmt", "advanced.ping.error"}
          COLLECTOR_ERROR = "Advanced ICMP: Collector error"
          COLLECTOR_DEPENDENCY_TARGETS = {
              "Advanced ICMP: High response time",
              "Advanced ICMP: High jitter",
              "Advanced ICMP: High packet loss",
              "Advanced ICMP: High RTT standard deviation",
              "Advanced ICMP: High time differences (Min/Max)",
              "Advanced ICMP: Long unavailable by ICMP ping",
              "Advanced ICMP: Unavailable by ICMP ping",
          }

          def fail(message):
              print(f"ERROR: {message}", file=sys.stderr)
              raise SystemExit(1)

          def collect_triggers(node):
              triggers = []
              if isinstance(node, dict):
                  if {"name", "expression", "priority"}.issubset(node):
                      triggers.append(node)
                  for value in node.values():
                      triggers.extend(collect_triggers(value))
              elif isinstance(node, list):
                  for value in node:
                      triggers.extend(collect_triggers(value))
              return triggers

          def item_signature(item):
              preprocessing = tuple(
                  (step.get("type", ""), tuple(str(v) for v in step.get("parameters", [])))
                  for step in item.get("preprocessing", [])
              )
              return (
                  item.get("name", ""), item.get("key", ""), item.get("type", ""),
                  str(item.get("history", "")), item.get("value_type", ""), item.get("units", ""),
                  preprocessing,
              )

          def trigger_signature(trigger):
              deps = tuple(sorted(
                  (dep.get("name", ""), str(dep.get("expression", "")))
                  for dep in trigger.get("dependencies", [])
              ))
              return (
                  trigger.get("name", ""), str(trigger.get("expression", "")),
                  trigger.get("priority", ""), trigger.get("status", "ENABLED"), deps,
              )

          def validate(version):
              path = ROOT / "templates" / f"zabbix-{version}" / TEMPLATE_FILE
              raw = path.read_text(encoding="utf-8")
              data = yaml.safe_load(raw)
              if str(data["zabbix_export"]["version"]) != version:
                  fail(f"Zabbix {version}: export version mismatch")
              template = data["zabbix_export"]["templates"][0]
              if template.get("template") != TEMPLATE_NAME:
                  fail(f"Zabbix {version}: template name mismatch")
              if str(template.get("vendor", {}).get("version", "")) != PROJECT_VERSION:
                  fail(f"Zabbix {version}: vendor.version must match VERSION ({PROJECT_VERSION})")
              for item in template.get("items", []):
                  key = str(item.get("key", ""))
                  if key.startswith(("icmpping[", "icmppingloss[", "icmppingsec[")):
                      fail(f"Zabbix {version}: native Zabbix ICMP keys are not allowed")
              items = {item["key"]: item for item in template.get("items", [])}
              if not EXPECTED_KEYS.issubset(items):
                  fail(f"Zabbix {version}: missing expected dependent items")
              for key in FLOAT_KEYS:
                  if items[key].get("value_type") != "FLOAT":
                      fail(f"Zabbix {version}: {key} must explicitly use FLOAT")
              if items["advanced.ping.error"].get("value_type") != "TEXT":
                  fail(f"Zabbix {version}: advanced.ping.error must be TEXT")
              masters = [item for item in template.get("items", []) if str(item.get("key", "")).startswith("advanced_icmp_ping.py[")]
              if len(masters) != 1:
                  fail(f"Zabbix {version}: exactly one external master is required")
              if masters[0].get("type") != "EXTERNAL" or masters[0].get("value_type") != "TEXT":
                  fail(f"Zabbix {version}: master item must be EXTERNAL/TEXT")
              if str(masters[0].get("history", "")) != "1h":
                  fail(f"Zabbix {version}: raw JSON history must be 1h")
              triggers = collect_triggers(data)
              by_name = {trigger["name"]: trigger for trigger in triggers}
              packet = by_name.get("Advanced ICMP: High packet loss")
              if packet is None:
                  fail(f"Zabbix {version}: packet loss trigger missing")
              packet_expr = str(packet.get("expression", ""))
              if "min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)" not in packet_expr:
                  fail(f"Zabbix {version}: packet loss must require two consecutive degraded samples")
              if "min(/Advanced ICMP Ping with Jitter/advanced.ping.rcv,#2)>0" not in packet_expr:
                  fail(f"Zabbix {version}: packet loss must suppress total outages")
              if "last(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)" in raw:
                  fail(f"Zabbix {version}: obsolete last(loss,#2) expression found")
              for name in COLLECTOR_DEPENDENCY_TARGETS:
                  trigger = by_name.get(name)
                  if trigger is None:
                      fail(f"Zabbix {version}: missing trigger {name!r}")
                  deps = {dep.get("name") for dep in trigger.get("dependencies", [])}
                  if COLLECTOR_ERROR not in deps:
                      fail(f"Zabbix {version}: {name!r} must depend on Collector error")
              macros = tuple(sorted((m.get("macro", ""), str(m.get("value", ""))) for m in template.get("macros", [])))
              return (
                  tuple(sorted(item_signature(item) for item in template.get("items", []))),
                  tuple(sorted(trigger_signature(trigger) for trigger in triggers)),
                  macros,
              )

          def main():
              for path in (ROOT / "templates").glob("zabbix-*/advanced-icmp-ping.yaml"):
                  if path.exists():
                      fail("separate Advanced ICMP Ping template must not exist")
              signatures = {version: validate(version) for version in ("7.0", "8.0")}
              if signatures["7.0"] != signatures["8.0"]:
                  fail("Zabbix 7.0 and 8.0 templates are not semantically equivalent")
              print(f"OK: approved non-hybrid templates validated; project version {PROJECT_VERSION}")

          if __name__ == "__main__":
              main()
          PY

      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Format and validate
        run: |
          ruff format scripts tools tests
          ruff check --fix scripts tools tests
          python tools/validate_templates.py
          python tools/validate_docs.py
          python -m compileall -q scripts tools tests
          ruff check scripts tools tests
          ruff format --check scripts tools tests
          pytest -q
      - name: Commit approved implementation
        run: |
          git config user.name "Karim Mansur"
          git config user.email "karim.mansur@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: retain approved non-hybrid hardening"
          git push origin HEAD:hardening/professionalization
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/_apply-approved-hardening.yml
          git commit -m "chore: remove temporary hardening workflow"
          git push origin HEAD:hardening/professionalization
