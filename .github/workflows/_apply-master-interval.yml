name: Apply master interval patch

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - .github/workflows/_apply-master-interval.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/professionalization

      - name: Apply explicit one-minute interval and documentation updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          template_paths = [
              Path("templates/zabbix-7.0/advanced-icmp-ping-with-jitter.yaml"),
              Path("templates/zabbix-8.0/advanced-icmp-ping-with-jitter.yaml"),
          ]

          for path in template_paths:
              text = path.read_text(encoding="utf-8")
              start = text.index("name: 'Advanced ICMP: raw JSON results'")
              history = text.index("      history: 1h", start)
              segment = text[start:history]
              if "      delay: 1m\n" not in segment:
                  text = text[:history] + "      delay: 1m\n" + text[history:]
              path.write_text(text, encoding="utf-8")

          validator = Path("tools/validate_templates.py")
          text = validator.read_text(encoding="utf-8")
          needle = '''        if str(item.get("timeout", "")) != "30s":\n            fail(f"Zabbix {version}: external master item timeout must remain 30s")\n'''
          replacement = needle + '''        if str(item.get("delay", "")) != "1m":\n            fail(f"Zabbix {version}: external master item update interval must remain 1m")\n'''
          if replacement not in text:
              if needle not in text:
                  raise SystemExit("validator insertion point not found")
              text = text.replace(needle, replacement, 1)
          validator.write_text(text, encoding="utf-8")

          docs = {
              Path("docs/en/configuration.md"): [
                  ("| `{$ADV_FPING_INTERVAL_MS}` | `100` |", "| `{$ADV_FPING_INTERVAL_MS}` | `250` |"),
                  ("| `{$ADV_FPING_TIMEOUT_MS}` | `1000` |", "| `{$ADV_FPING_TIMEOUT_MS}` | `250` |"),
                  ("20 packets * 100 ms = approximately 2 seconds", "20 packets * 250 ms = approximately 5 seconds"),
                  ("Parameters are positional because Zabbix passes macro values directly to the external script.\n", "Parameters are positional because Zabbix passes macro values directly to the external script.\n\nThe master External check has an explicit update interval of `1m`. Therefore, count-based trigger windows map approximately to wall-clock time as follows:\n\n```text\n#3  = approximately 3 minutes\n#30 = approximately 30 minutes\n```\n"),
              ],
              Path("docs/pt-BR/configuration.md"): [
                  ("| `{$ADV_FPING_INTERVAL_MS}` | `100` |", "| `{$ADV_FPING_INTERVAL_MS}` | `250` |"),
                  ("| `{$ADV_FPING_TIMEOUT_MS}` | `1000` |", "| `{$ADV_FPING_TIMEOUT_MS}` | `250` |"),
                  ("20 pacotes * 100 ms = aproximadamente 2 segundos", "20 pacotes * 250 ms = aproximadamente 5 segundos"),
                  ("Os parâmetros são posicionais porque o Zabbix passa as macros diretamente para o script externo.\n", "Os parâmetros são posicionais porque o Zabbix passa as macros diretamente para o script externo.\n\nO External check mestre possui intervalo de atualização explícito de `1m`. Portanto, as janelas dos triggers baseadas em quantidade de coletas correspondem aproximadamente a:\n\n```text\n#3  = aproximadamente 3 minutos\n#30 = aproximadamente 30 minutos\n```\n"),
              ],
              Path("docs/en/triggers.md"): [
                  ("Default severity: `HIGH`.", "Default severity: `AVERAGE`."),
                  ("Default severity: `DISASTER`.", "Default severity: `HIGH`."),
                  ("last(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)", "min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)"),
                  ("The problem is raised when no ICMP replies are received during the last 3 batches:", "The problem is raised when no ICMP replies are received during the last 3 batches. With the explicit `1m` master-item interval, this is approximately 3 minutes:"),
                  ("The escalation condition requires 30 consecutive batches without a reply:", "The escalation condition requires 30 consecutive batches without a reply. With the explicit `1m` master-item interval, this is approximately 30 minutes:"),
              ],
              Path("docs/pt-BR/triggers.md"): [
                  ("Prioridade padrão: `HIGH`.", "Prioridade padrão: `AVERAGE`."),
                  ("Prioridade padrão: `DISASTER`.", "Prioridade padrão: `HIGH`."),
                  ("last(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)", "min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)"),
                  ("O problema ocorre quando nenhuma resposta ICMP é recebida durante os últimos 3 lotes:", "O problema ocorre quando nenhuma resposta ICMP é recebida durante os últimos 3 lotes. Com o intervalo explícito de `1m` no item mestre, isso representa aproximadamente 3 minutos:"),
                  ("A escalada de indisponibilidade exige 30 lotes consecutivos sem resposta:", "A escalada de indisponibilidade exige 30 lotes consecutivos sem resposta. Com o intervalo explícito de `1m` no item mestre, isso representa aproximadamente 30 minutos:"),
              ],
          }

          for path, replacements in docs.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text and new not in text:
                      raise SystemExit(f"documentation insertion point not found in {path}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates tools docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: enforce one-minute master collection interval"
          git push origin HEAD:hardening/professionalization
