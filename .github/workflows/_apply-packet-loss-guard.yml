name: Apply packet loss guard

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - .github/workflows/_apply-packet-loss-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/professionalization
      - name: Update templates, validator and docs
        shell: python
        run: |
          from pathlib import Path
          import re

          repo = Path('.')
          pattern = re.compile(
              r"min\(/Advanced ICMP Ping with\s+Jitter/advanced\.ping\.loss,#2\)>\{\$ADV_ICMP_LOSS_WARN\}"
          )
          replacement = (
              "min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)"
              ">{$ADV_ICMP_LOSS_WARN} and "
              "min(/Advanced ICMP Ping with Jitter/advanced.ping.rcv,#2)>0"
          )

          for rel in (
              'templates/zabbix-7.0/advanced-icmp-ping-with-jitter.yaml',
              'templates/zabbix-8.0/advanced-icmp-ping-with-jitter.yaml',
          ):
              path = repo / rel
              text = path.read_text(encoding='utf-8')
              count = len(pattern.findall(text))
              if count != 4:
                  raise SystemExit(f'{rel}: expected 4 packet-loss expressions, found {count}')
              path.write_text(pattern.sub(replacement, text), encoding='utf-8')

          validator = repo / 'tools/validate_templates.py'
          text = validator.read_text(encoding='utf-8')
          old = '''        if (\n            "min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)"\n            not in packet_loss["expression"]\n        ):\n            fail(f"Zabbix {version}: packet loss trigger must evaluate both latest samples")\n'''
          new = '''        if (\n            "min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)"\n            not in packet_loss["expression"]\n        ):\n            fail(f"Zabbix {version}: packet loss trigger must evaluate both latest samples")\n        if (\n            "min(/Advanced ICMP Ping with Jitter/advanced.ping.rcv,#2)>0"\n            not in packet_loss["expression"]\n        ):\n            fail(\n                f"Zabbix {version}: packet loss trigger must require received packets "\n                "in both latest samples"\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('validator: expected packet-loss validation block not found exactly once')
          validator.write_text(text.replace(old, new), encoding='utf-8')

          docs = {
              'docs/en/triggers.md': (
                  'min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)>{$ADV_ICMP_LOSS_WARN}',
                  'min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)>{$ADV_ICMP_LOSS_WARN} and min(/Advanced ICMP Ping with Jitter/advanced.ping.rcv,#2)>0',
                  'The threshold is controlled by `{$ADV_ICMP_LOSS_WARN}`.',
                  'The threshold is controlled by `{$ADV_ICMP_LOSS_WARN}`. The trigger represents degraded connectivity only while both evaluated batches still receive at least one ICMP reply. Complete loss (`rcv=0`) is handled by the unavailability triggers instead.'
              ),
              'docs/pt-BR/triggers.md': (
                  'min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)>{$ADV_ICMP_LOSS_WARN}',
                  'min(/Advanced ICMP Ping with Jitter/advanced.ping.loss,#2)>{$ADV_ICMP_LOSS_WARN} and min(/Advanced ICMP Ping with Jitter/advanced.ping.rcv,#2)>0',
                  'O limite é controlado por `{$ADV_ICMP_LOSS_WARN}`.',
                  'O limite é controlado por `{$ADV_ICMP_LOSS_WARN}`. O trigger representa degradação de conectividade somente quando os dois lotes avaliados ainda recebem pelo menos uma resposta ICMP. Perda total (`rcv=0`) é tratada pelos triggers de indisponibilidade.'
              ),
          }
          for rel, (old_expr, new_expr, old_note, new_note) in docs.items():
              path = repo / rel
              text = path.read_text(encoding='utf-8')
              if text.count(old_expr) != 1 or text.count(old_note) != 1:
                  raise SystemExit(f'{rel}: expected documentation text not found exactly once')
              text = text.replace(old_expr, new_expr).replace(old_note, new_note)
              path.write_text(text, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "Karim Mansur"
          git config user.email "karim.mansur@outlook.com"
          git add templates tools docs
          git diff --cached --check
          git commit -m "fix: suppress packet loss alert during total outage"
          git push origin HEAD:hardening/professionalization
