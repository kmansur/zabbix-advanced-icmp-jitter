name: Apply native ICMP review fixes

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - .github/workflows/_apply-native-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/professionalization

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Apply reviewed changes
        run: |
          python tools/_apply_native_review_fixes.py
          # Workflow files cannot be pushed by the Actions token. The release
          # workflow is updated separately through the repository API.
          git checkout -- .github/workflows/release.yml

      - name: Validate repository
        run: |
          python -m pip install -r requirements-dev.txt
          ruff format tools/validate_templates.py tests/test_advanced_icmp_ping.py
          python tools/validate_templates.py
          python tools/validate_docs.py
          python -m compileall -q scripts tools tests
          ruff check scripts tools tests
          ruff format --check scripts tools tests
          pytest -q

      - name: Commit reviewed implementation
        run: |
          git config user.name 'Karim Mansur'
          git config user.email 'karim.mansur@outlook.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add native ICMP mode and incorporate review fixes'
          git push origin HEAD:hardening/professionalization
