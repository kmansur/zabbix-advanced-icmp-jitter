name: Fix dependency shape

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - .github/workflows/_fix-dependency-shape.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/professionalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Remove nested dependency metadata
        shell: python
        run: |
          from pathlib import Path
          import yaml

          class NoAliasDumper(yaml.SafeDumper):
              def ignore_aliases(self, data):
                  return True

          def clean(node):
              if isinstance(node, dict):
                  deps = node.get("dependencies")
                  if isinstance(deps, list):
                      for dep in deps:
                          if isinstance(dep, dict):
                              dep.pop("dependencies", None)
                  for value in node.values():
                      clean(value)
              elif isinstance(node, list):
                  for value in node:
                      clean(value)

          for version in ("7.0", "8.0"):
              path = Path(f"templates/zabbix-{version}/advanced-icmp-ping-with-jitter.yaml")
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              clean(data)
              path.write_text(
                  yaml.dump(data, Dumper=NoAliasDumper, sort_keys=False, allow_unicode=True, width=1000),
                  encoding="utf-8",
              )
      - name: Validate
        run: |
          python tools/validate_templates.py
          python tools/validate_docs.py
          ruff check scripts tools tests
          ruff format --check scripts tools tests
          pytest -q
      - name: Commit cleanup
        run: |
          git config user.name "Karim Mansur"
          git config user.email "karim.mansur@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep trigger dependencies flat"
          git push origin HEAD:hardening/professionalization
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/_fix-dependency-shape.yml
          git commit -m "chore: remove temporary dependency workflow"
          git push origin HEAD:hardening/professionalization
