name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tools tests

      - name: Run tests
        run: pytest -q

  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check scripts tools tests

      - name: Ruff format check
        run: ruff format --check scripts tools tests

      - name: Validate versioned Zabbix templates
        run: python tools/validate_templates.py

      - name: Validate bilingual documentation and local links
        run: python tools/validate_docs.py

  integration:
    name: Real fping integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install fping
        run: |
          sudo apt-get update
          sudo apt-get install --yes fping

      - name: Run collector against localhost
        run: |
          python scripts/advanced_icmp_ping.py 127.0.0.1 5 100 100 > /tmp/icmp.json
          cat /tmp/icmp.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/icmp.json").read_text(encoding="utf-8"))
          assert result["error"] == "", result
          assert result["target"] == "127.0.0.1", result
          assert result["xmt"] == 5, result
          assert result["rcv"] == 5, result
          assert result["loss"] == 0, result
          assert len(result["rtts"]) == 5, result
          PY
