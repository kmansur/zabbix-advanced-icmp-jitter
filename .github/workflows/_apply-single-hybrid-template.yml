name: Apply single hybrid ICMP template

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - tools/_consolidate_hybrid_template.py
      - .github/workflows/_apply-single-hybrid-template.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/professionalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Consolidate template
        run: python tools/_consolidate_hybrid_template.py
      - name: Normalize generated validator
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/validate_templates.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '                f"Zabbix {version}: packet loss trigger must use two degraded non-total-loss samples"\n':
                  '                f"Zabbix {version}: packet loss trigger must use two degraded "\n'
                  '                "non-total-loss samples"\n',
              '                    f"Zabbix {version}: advanced trigger {name!r} must depend on collector error and packet loss"\n':
                  '                    f"Zabbix {version}: advanced trigger {name!r} must depend on "\n'
                  '                    "collector error and packet loss"\n',
              '                    f"Zabbix {version}: native core trigger {name!r} must not depend on the external collector"\n':
                  '                    f"Zabbix {version}: native core trigger {name!r} must not depend "\n'
                  '                    "on the external collector"\n',
              '                f"{version_dir.name}: separate native template must not exist; the project ships one hybrid template"\n':
                  '                f"{version_dir.name}: separate native template must not exist; "\n'
                  '                "the project ships one hybrid template"\n',
              '        f"OK: single hybrid ICMP template validated for Zabbix {versions}; project version {project_version}"\n':
                  '        f"OK: single hybrid ICMP template validated for Zabbix {versions}; "\n'
                  '        f"project version {project_version}"\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected validator line not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Format and validate
        run: |
          ruff format tools/validate_templates.py tests
          python tools/validate_templates.py
          python tools/validate_docs.py
          python -m compileall -q scripts tools tests
          ruff check scripts tools tests
          ruff format --check scripts tools tests
          pytest -q
      - name: Commit implementation
        run: |
          git config user.name "Karim Mansur"
          git config user.email "karim.mansur@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: consolidate native core and advanced ICMP statistics"
          git push origin HEAD:hardening/professionalization
