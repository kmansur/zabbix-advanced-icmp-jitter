name: Finalize single hybrid ICMP template

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - .github/workflows/_apply-single-hybrid-template.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/professionalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Fix export syntax and harden validator
        shell: python
        run: |
          import re
          from pathlib import Path
          import yaml

          class NoAliasDumper(yaml.SafeDumper):
              def ignore_aliases(self, data):
                  return True

          for version in ("7.0", "8.0"):
              path = Path(f"templates/zabbix-{version}/advanced-icmp-ping-with-jitter.yaml")
              text = path.read_text(encoding="utf-8")
              text = re.sub(r"\{\$\{([A-Z0-9_]+)\}\}", lambda m: "{$" + m.group(1) + "}", text)
              data = yaml.safe_load(text)
              text = yaml.dump(
                  data,
                  Dumper=NoAliasDumper,
                  sort_keys=False,
                  allow_unicode=True,
                  width=1000,
              )
              path.write_text(text, encoding="utf-8")

          validator = Path("tools/validate_templates.py")
          text = validator.read_text(encoding="utf-8")
          old = '''        path = version_dir / filename
          if not path.is_file():
              fail(f"missing {path.relative_to(ROOT)}")
          with path.open(encoding="utf-8") as handle:
              data = yaml.safe_load(handle)
'''
          new = '''        path = version_dir / filename
          if not path.is_file():
              fail(f"missing {path.relative_to(ROOT)}")
          raw = path.read_text(encoding="utf-8")
          if "{${" in raw:
              fail(f"{path.relative_to(ROOT)} contains malformed Zabbix user macro syntax")
          if re.search(r"(^|\\s)[&*]id[0-9]+", raw):
              fail(f"{path.relative_to(ROOT)} must not contain YAML aliases/anchors")
          data = yaml.safe_load(raw)
'''
          if old not in text:
              raise SystemExit("load_exports block not found")
          validator.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate repository
        run: |
          ruff format tools/validate_templates.py tests
          python tools/validate_templates.py
          python tools/validate_docs.py
          python -m compileall -q scripts tools tests
          ruff check scripts tools tests
          ruff format --check scripts tools tests
          pytest -q
      - name: Commit final hybrid export
        run: |
          git config user.name "Karim Mansur"
          git config user.email "karim.mansur@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize single hybrid ICMP template exports"
          git push origin HEAD:hardening/professionalization
