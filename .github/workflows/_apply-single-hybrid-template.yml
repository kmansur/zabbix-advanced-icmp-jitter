name: Apply single hybrid ICMP template

on:
  push:
    branches:
      - hardening/professionalization
    paths:
      - tools/_consolidate_hybrid_template.py
      - .github/workflows/_apply-single-hybrid-template.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: hardening/professionalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Consolidate template
        run: python tools/_consolidate_hybrid_template.py
      - name: Format and validate
        run: |
          ruff format tools/validate_templates.py tests
          python tools/validate_templates.py
          python tools/validate_docs.py
          python -m compileall -q scripts tools tests
          ruff check scripts tools tests
          ruff format --check scripts tools tests
          pytest -q
      - name: Commit implementation
        run: |
          git config user.name "Karim Mansur"
          git config user.email "karim.mansur@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: consolidate native core and advanced ICMP statistics"
          git push origin HEAD:hardening/professionalization
